services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-*}
    env_file:
      - .env

  # Uncomment if you outgrow the in-memory session store (session_store.py) —
  # e.g. running multiple uvicorn workers that need to share task state.
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
